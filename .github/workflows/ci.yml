name: Build Docker image (no publish)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  BUILD_CONTEXT: .
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_LOCAL: bull-cow:local      # local name while building
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/bull-cow

jobs:
  build:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_LOCAL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container
        run: |
          echo "Running container..."
          docker run -d --name bullcow -p 5000:5000 -e PORT=5000 ${{ env.IMAGE_LOCAL }}

      - name: Wait for service & test endpoint
        run: |
          set -e
          ATTEMPTS=20
          until curl -fsS http://localhost:5000/ > /dev/null; do
            ATTEMPTS=$((ATTEMPTS-1))
            if [ $ATTEMPTS -le 0 ]; then
              docker logs bullcow || true
              exit 1
            fi
            echo "Service not ready yet, retrying..."
            sleep 2
          done
          echo "Service is up!"

      # ---------- PUSH TO GHCR ----------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR (Best practice)
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ env.IMAGE_BASE }}"

          # CI tag for commit traceability
          docker tag ${{ env.IMAGE_LOCAL }} "$IMAGE:ci-${{ github.sha }}"
          echo "GHCR_CI_TAG=$IMAGE:ci-${{ github.sha }}" >> $GITHUB_ENV

          # Only tag latest on main
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ${{ env.IMAGE_LOCAL }} "$IMAGE:latest"
            echo "GHCR_LATEST_TAG=$IMAGE:latest" >> $GITHUB_ENV
          fi

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$GHCR_CI_TAG"
          if [ -n "${GHCR_LATEST_TAG:-}" ]; then
            docker push "$GHCR_LATEST_TAG"
          fi

      - name: Summary
        run: |
          {
            echo "## Build Successful!"
            echo "**Image base:** \`${{ env.IMAGE_BASE }}\`"
            echo "**CI tag:** \`${GHCR_CI_TAG}\`"
            if [ -n "${GHCR_LATEST_TAG:-}" ]; then
              echo "**Latest tag:** \`${GHCR_LATEST_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
