name: Build Docker image (no publish)

on:
  push:
    branches: ["**"]     # build for all branches
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DOCKER_CONTEXT: .
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_TAG: bull-cow:ci-${{ github.sha }}

jobs:
  build:
    name: Install deps & build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Install app dependencies (Python) =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found at repo root. Skipping."
          fi

      # ===== Build Docker image (no push) =====
      - name: Set up QEMU (optional, for multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build without pushing; keep it fast and cache-enabled
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: false                 # set true if you need 'docker images' on runner
          platforms: linux/amd64      # change/add linux/arm64 if needed
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker build completed"
            echo ""
            echo "**Tag (local CI only):** \`${{ env.IMAGE_TAG }}\`"
            echo ""
            echo "No registry push was performed."
          } >> "$GITHUB_STEP_SUMMARY"


