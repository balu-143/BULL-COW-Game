name: Build Docker image (no publish)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  BUILD_CONTEXT: .            # <-- renamed (used for docker build context)
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_TAG: bull-cow:ci-${{ github.sha }}

jobs:
  build:
    name: Install deps & build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Safety: ensure Docker CLI uses the default docker context
      - name: Clear conflicting DOCKER_CONTEXT (if any)
        run: echo "DOCKER_CONTEXT=" >> "$GITHUB_ENV"

      # Install Python dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found at repo root. Skipping."
          fi

      # Set up Docker Buildx (single-arch; no QEMU required)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image (no push)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}   # <-- use BUILD_CONTEXT
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      
      - name: Run Docker container
        run: |
          echo "Running container..."
          docker run -d --name bullcow -p 5000:5000 -e PORT=5000 ${{ env.IMAGE_TAG }}

      
      - name: Wait for service & test endpoint
        run: |
          set -e
          ATTEMPTS=20
          until curl -fsS http://localhost:5000/ > /dev/null; do
            ATTEMPTS=$((ATTEMPTS-1))
            if [ $ATTEMPTS -le 0 ]; then
              echo "Service did not become ready in time. Printing logs..."
              docker logs bullcow || true
              exit 1
            fi
            echo "Service not ready yet, retrying..."
            sleep 2
          done
          echo "Service is up!"

     

    
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        if: github.event_name == 'push'
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/bull-cow"
          docker tag "${{ env.IMAGE_TAG }}" "$GHCR_IMAGE:ci-${{ github.sha }}"
          echo "GHCR_CI_TAG=$GHCR_IMAGE:ci-${{ github.sha }}" >> "$GITHUB_ENV"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${{ env.IMAGE_TAG }}" "$GHCR_IMAGE:latest"
            echo "GHCR_LATEST_TAG=$GHCR_IMAGE:latest" >> "$GITHUB_ENV"
          fi

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          set -e
          docker push "$GHCR_CI_TAG"
          if [ -n "${GHCR_LATEST_TAG:-}" ]; then
            docker push "$GHCR_LATEST_TAG"
          fi

      - name: Debug owner
        run: |
         echo "repository: ${{ github.repository }}"
         echo "repository_owner: ${{ github.repository_owner }}"
         echo "ref: ${{ github.ref }}"

      - name: Summary
        run: |
          {
            echo "## Build successful!"
            echo ""
            echo "**Image tag (local to runner):** \`${{ env.IMAGE_TAG }}\`"
            echo "No registry push was performed."
          } >> "$GITHUB_STEP_SUMMARY"








